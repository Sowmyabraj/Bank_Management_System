<div class="layout">

  <!-- 🔹 Sidebar -->
  <aside class="sidebar">

    <h2 class="logo" routerLink="/dashboard">🏦 MyBank</h2>

    <nav>
      <a routerLink="/" routerLinkActive="active">
        <span class="icon">🏠</span> Home
      </a>

      <a routerLink="/dashboard/accounts" routerLinkActive="active">
        <span class="icon">💳</span> Accounts
      </a>

      <a routerLink="/dashboard/transactions" routerLinkActive="active">
        <span class="icon">📊</span> Transactions
      </a>

      <a routerLink="/dashboard/statements" routerLinkActive="active">
        <span class="icon">📄</span> Statements
      </a>
    </nav>

    <div class="logout" (click)="onLogout()">
      <span class="icon">🚪</span> Logout
    </div>

  </aside>

  <!-- 🔹 Main -->
  <main class="main">

    <!-- 🔹 Header -->
    <header class="header">

      <div class="center">
        <span class="welcome">
          Welcome, {{ customerName || 'Customer' }}
        </span>
      </div>

      <div class="right">

        <div class="balance" (click)="toggleDetails()">
          <span class="label">Balance</span>

          <!-- ✅ Loading -->
          <!-- <span *ngIf="isLoading">Loading...</span> -->

          <!-- ✅ Error -->
          <span *ngIf="errorMessage" class="error">
            {{ errorMessage }}
          </span>

          <!-- ✅ Data -->
          <span *ngIf="!isLoading && !errorMessage" class="value">
            ₹ {{ showDetails ? (totalBalance | number:'1.2-2') : '••••••' }}
          </span>

          <span class="eye">👁</span>
        </div>

        <div class="profile-icon">
          {{ customerName?.charAt(0) || 'C' }}
        </div>

      </div>

    </header>

    <!-- 🔹 Body -->
    <section class="body">
      <router-outlet></router-outlet>
    </section>

  </main>

</div>
