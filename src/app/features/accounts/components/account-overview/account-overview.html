<!-- 🔹 MAIN CONTENT -->
<div class="accounts-wrapper">

  <h2 class="title">💳 Your Accounts</h2>
  <p class="subtitle">View and manage your accounts</p>

  <!-- 🔥 Loading -->
  <div *ngIf="loading$ | async" class="info-text">Loading accounts...</div>

  <!-- 🔥 Error -->
  <div *ngIf="error$ | async as err" class="error-text">{{ err }}</div>

  <!-- 🔥 Data -->
  <div *ngIf="(paginatedAccounts$ | async) as accounts">

    <!-- Empty -->
    <div *ngIf="accounts.length === 0" class="info-text">
      No accounts found
    </div>

    <!-- 🔹 Cards -->
    <div class="account-container">
      <div 
        class="account-card"
        *ngFor="let acc of accounts"
      >
        <div>💼 {{ acc.type }}</div>
        <div>{{ acc.customerName }}</div>
        <div>₹ {{ acc.balance }}</div>
        <div>{{ acc.branch }}</div>

        <button class="details-btn" (click)="openAccount(acc)">
          View Details
        </button>
      </div>
    </div>

    <!-- 🔹 Pagination -->
    <div class="pagination">
      <button (click)="prevPage()" [disabled]="currentPage === 1">
        ⬅ Prev
      </button>

      <span>Page {{ currentPage }} of {{ totalPages }}</span>

      <button (click)="nextPage()" [disabled]="currentPage === totalPages">
        Next ➡
      </button>
    </div>

  </div>

</div>
