<button (click)="goBack()">⬅ Back to Accounts</button>

<div *ngIf="loading">Loading...</div>

<div *ngIf="account && !loading">

  <h2>{{ account.customerName }}</h2>

  <p><strong>Account:</strong> {{ account.accountNumber }}</p>
  <p><strong>Balance:</strong> ₹ {{ account.balance }}</p>
  <p><strong>Branch:</strong> {{ account.branch }}</p>

  <!-- 🔥 Tabs -->
  <div>
    <button (click)="showTransactions()">Transactions</button>
    <button (click)="showStatement()">Statement</button>
  </div>

  <!-- ================= TRANSACTIONS ================= -->
  <div *ngIf="viewMode === 'transactions'">

    <h3>Transactions</h3>

    <!-- Filters -->
    <div>
      <select [(ngModel)]="type">
        <option value="">All</option>
        <option value="Credit">Credit</option>
        <option value="Debit">Debit</option>
      </select>

      <input type="number" [(ngModel)]="minAmount" placeholder="Min">
      <input type="number" [(ngModel)]="maxAmount" placeholder="Max">

      <input type="date" [(ngModel)]="fromDate">
      <input type="date" [(ngModel)]="toDate">

      <button (click)="applyFilters()">Apply</button>
    </div>

    <!-- Table -->
    <table *ngIf="pagedTransactions.length > 0">
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Amount</th>
        <th>Balance</th>
      </tr>

      <tr *ngFor="let t of pagedTransactions">
        <td>{{ t.date }}</td>
        <td>{{ t.type }}</td>
        <td>₹ {{ t.amount }}</td>
        <td>₹ {{ t.balanceAfter }}</td>
      </tr>
    </table>

    <!-- Pagination -->
    <div>
      <button (click)="prevPage()">Prev</button>
      Page {{ page }} / {{ totalPages }}
      <button (click)="nextPage()">Next</button>
    </div>

  </div>

  <!-- ================= STATEMENT ================= -->
  <div *ngIf="viewMode === 'statement'">

    <h3>Statement</h3>

    <!-- Filters -->
    <div>
      <input type="date" [(ngModel)]="fromDate">
      <input type="date" [(ngModel)]="toDate">

      <button (click)="applyFilters()">Apply</button>
    </div>

    <!-- Actions -->
    <div>
      <button (click)="downloadCSV()">Download CSV</button>
      <button (click)="downloadPDF()">Download PDF</button>
    </div>

  </div>

</div>
