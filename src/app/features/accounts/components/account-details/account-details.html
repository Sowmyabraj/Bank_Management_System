<div class="account-wrapper">

  <!-- 🔹 BACK BUTTON -->
  <button class="back-btn" (click)="goBack()">⬅ Back to Accounts</button>

  <!-- 🔹 LOADING -->
  <div *ngIf="loading$ | async">Loading...</div>

  <!-- 🔹 ERROR -->
  <div *ngIf="error$ | async as err">
    {{ err }}
  </div>

  <!-- 🔹 ACCOUNT -->
  <div *ngIf="(account$ | async) as account" class="account-card">

    <h2>{{ account.customerName }}</h2>

    <p><strong>Account:</strong> {{ account.accountNumber }}</p>
    <p><strong>Balance:</strong> ₹ {{ account.balance }}</p>
    <p><strong>Branch:</strong> {{ account.branch }}</p>

    <!-- 🔹 TABS -->
    <div class="tab-buttons">
      <button (click)="showTransactions()">Transactions</button>
      <button (click)="showStatement()">Statement</button>
    </div>

    <!-- 🔥 TRANSACTIONS (REUSED COMPONENT) -->
    <div *ngIf="viewMode === 'transactions'">
      <app-transaction-history [accountId]="account.id"></app-transaction-history>
    </div>

    <!-- 🔥 STATEMENT (REUSED COMPONENT) -->
    <div *ngIf="viewMode === 'statement'">
      <app-statements [accountId]="account.id"></app-statements>
    </div>

  </div>
</div>
