<div class="container">

  <h2>📄 Statement Download</h2>

  <!-- 🔹 Loading -->
  <div *ngIf="loading$ | async">Loading...</div>

  <!-- 🔹 Error -->
  <div *ngIf="error$ | async as err" class="error">
    {{ err }}
  </div>

  <div *ngIf="(accounts$ | async) as accounts">

    <!-- 🔥 ACCOUNT FIELD -->
    <div class="form-group">

      <label>Account</label>
<select [(ngModel)]="selectedAccountId" [disabled]="!!accountId">

        <option [ngValue]="null">Select Account</option>

        <option *ngFor="let acc of accounts" [ngValue]="acc.id">
          {{ acc.customerName }} - {{ acc.accountNumber }}
        </option>

      </select>

    </div>

    <!-- 🔥 DATE RANGE -->
    <div class="form-group">
      <label>From Date</label>
      <input type="date" [(ngModel)]="fromDate">
    </div>

    <div class="form-group">
      <label>To Date</label>
      <input type="date" [(ngModel)]="toDate">
    </div>

    <!-- 🔥 FORMAT -->
    <div class="form-group">
      <label>Format</label>
      <select [(ngModel)]="format">
        <option value="">Select Format</option>
        <option value="csv">CSV</option>
        <option value="pdf">PDF</option>
      </select>
    </div>

    <!-- 🔥 ACTION BUTTONS -->
    <div class="btn-group">
      <button class="primary-btn" (click)="downloadStatement(accounts)">
        Download
      </button>

      <button class="secondary-btn" (click)="resetForm()">
        Reset
      </button>
    </div>

  </div>

</div>
