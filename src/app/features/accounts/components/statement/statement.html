<div class="statement-container">

  <h2>📄 Account Statement</h2>

  <div class="form-row">

    <!-- Account -->
    <select [(ngModel)]="selectedAccountId">
      <option value="" disabled selected hidden>Select Account</option>
      <option *ngFor="let acc of accounts" [value]="acc.id">
        {{ acc.customerName }} - ****{{ acc.accountNumber?.slice(-4) }}
      </option>
    </select>

    <!-- From Date -->
    <input type="date" [(ngModel)]="fromDate">

    <!-- To Date -->
    <input type="date" [(ngModel)]="toDate">

    <!-- Format -->
    <select [(ngModel)]="format">
      <option value="" disabled selected hidden>Select Format</option>
      <option value="pdf">PDF</option>
      <option value="csv">CSV</option>
    </select>

    <!-- Download -->
    <button (click)="downloadStatement()">Download</button>

    <button class="secondary-btn" (click)="resetForm()">
  Reset
</button>
  </div>

</div>
